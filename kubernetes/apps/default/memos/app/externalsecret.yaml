apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-oidc-client
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - remoteRef:
        key: memos-oidc-client
        property: client-secret
      secretKey: client-secret
  target:
    name: memos-oidc-client
