apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/weekly-backup: enabled
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
