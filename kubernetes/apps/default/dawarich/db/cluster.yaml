apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:18.6-3.6.4-standard-trixie@sha256:5d75444724cea1824cd48d8328cde142b3045abcb8822d0b48c2a40a7a0eb956
  postgresql:
    parameters:
      random_page_cost: "1.1"
  bootstrap:
    initdb:
      database: dawarich
      owner: dawarich
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
