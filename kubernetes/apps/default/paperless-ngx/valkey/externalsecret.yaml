apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-valkey
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - remoteRef:
        key: paperless-ngx-valkey
        property: password
      secretKey: VALKEY_PASSWORD
  target:
    name: paperless-ngx-valkey
