apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - remoteRef:
        key: paperless-ngx
        property: username
      secretKey: PAPERLESS_ADMIN_USER
    - remoteRef:
        key: paperless-ngx
        property: password
      secretKey: PAPERLESS_ADMIN_PASSWORD
    - remoteRef:
        key: paperless-ngx
        property: secret-key
      secretKey: PAPERLESS_SECRET_KEY
    - remoteRef:
        key: paperless-ngx
        property: socialaccount-providers
      secretKey: PAPERLESS_SOCIALACCOUNT_PROVIDERS
    - remoteRef:
        key: paperless-ngx-valkey
        property: password
      secretKey: valkey_password
    - remoteRef:
        key: paperless-ngx
        property: outlook-client-id
      secretKey: PAPERLESS_OUTLOOK_OAUTH_CLIENT_ID
    - remoteRef:
        key: paperless-ngx
        property: outlook-client-secret
      secretKey: PAPERLESS_OUTLOOK_OAUTH_CLIENT_SECRET
  target:
    name: paperless-ngx
    template:
      mergePolicy: Merge
      data:
        PAPERLESS_REDIS: 'redis://:{{ .valkey_password | toString | urlquery | replace "+" "%20" }}@paperless-ngx-valkey.default.svc.cluster.local:6379/0'
