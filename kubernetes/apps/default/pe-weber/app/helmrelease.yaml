apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pe-weber
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: pe-weber
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: longhorn
      namespace: longhorn
  values:
    controllers:
      pe-weber:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/feltenj/pe-weber-website
              tag: sha-d837e7867f689aa380401cefe529067e248668a3@sha256:5ce71c190de69056eee0fdaf1e1466cdf933c7e9bb0d105f066b3676d99d1641
            env:
              HOST: 0.0.0.0
              PORT: &port 4321
              REVIEWS_FILE: /app/.data/reviews.json
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: pe-weber
        ports:
          http:
            port: *port
    route:
      app-external:
        hostnames:
          - "pe-weber.denniseffing.de"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      reviews:
        existingClaim: pe-weber-reviews
        globalMounts:
          - path: /app/.data
      tmp:
        type: emptyDir
