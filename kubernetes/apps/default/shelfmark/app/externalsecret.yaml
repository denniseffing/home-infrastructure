apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - remoteRef:
        key: prowlarr
        property: api-key
      secretKey: PROWLARR_API_KEY
    - remoteRef:
        key: sabnzbd
        property: api-key
      secretKey: SABNZBD_API_KEY
    - remoteRef:
        key: shelfmark
        property: audiobookshelf-api-token
      secretKey: AUDIOBOOKSHELF_TOKEN
  target:
    name: shelfmark
