apiVersion: v1
kind: Service
metadata:
  name: k8s-gateway-cluster
spec:
  type: ClusterIP
  clusterIP: 10.43.0.53
  selector:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/instance: k8s-gateway
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
