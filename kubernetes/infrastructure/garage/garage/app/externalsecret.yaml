apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: garage-admin
  data:
    - secretKey: adminToken
      remoteRef:
        key: garage-admin
        property: admin-token
    - secretKey: keyId
      remoteRef:
        key: garage-admin
        property: key-id
    - secretKey: rpcSecret
      remoteRef:
        key: garage-admin
        property: rpc-secret
    - secretKey: secretKey
      remoteRef:
        key: garage-admin
        property: secret-key
---
