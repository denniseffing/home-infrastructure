apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-sidecar
  labels:
    denniseffing.de/source: "public"
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/monitoring/gatus-sidecar/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
  wait: false
