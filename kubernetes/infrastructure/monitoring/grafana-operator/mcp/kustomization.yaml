apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - grafanadashboard.yaml
  - grafanaserviceaccount.yaml
  - helmrelease.yaml
  - ocirepository.yaml
  - securitypolicy.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: grafana-mcp-dashboard
    files:
      - grafana-mcp.json=./resources/grafana-mcp.json
generatorOptions:
  disableNameSuffixHash: true
