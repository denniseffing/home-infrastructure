apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana-mcp-api-key-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-mcp
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: grafana-mcp-api-key-auth
    extractFrom:
      - headers:
          - Authorization
    sanitize: true
