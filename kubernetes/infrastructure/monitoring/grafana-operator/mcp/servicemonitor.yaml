---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: mcp-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: grafana-mcp
      app.kubernetes.io/component: mcp-server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
