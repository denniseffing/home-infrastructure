apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - grafana.yaml
  - grafanadatasource.yaml
  - pocketidoidcclient.yaml
  - securitypolicy.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: grafana-pocket-id-icon
    files:
      - gf-pocket-id.svg=./resources/pocket-id.svg
generatorOptions:
  disableNameSuffixHash: true
