apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-oidc-callback
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  hostnames:
    - auth.internal.denniseffing.de
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2/callback
      backendRefs:
        - name: pocket-id
          port: 1411
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: envoy-gateway-oidc-credentials
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
  to:
    - group: ""
      kind: Secret
      name: envoy-gateway-oidc-credentials
