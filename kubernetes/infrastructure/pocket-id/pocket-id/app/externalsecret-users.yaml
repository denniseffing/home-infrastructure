apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-user-denniseffing
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - remoteRef:
        key: pocket-id-denniseffing
        property: username
      secretKey: username
    - remoteRef:
        key: pocket-id-denniseffing
        property: email
      secretKey: email
    - remoteRef:
        key: pocket-id-denniseffing
        property: first-name
      secretKey: firstName
    - remoteRef:
        key: pocket-id-denniseffing
        property: last-name
      secretKey: lastName
  target:
    name: pocket-id-user-denniseffing
---
