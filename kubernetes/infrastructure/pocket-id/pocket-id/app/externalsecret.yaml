apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-encryption
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - remoteRef:
        key: pocket-id
        property: encryption-key
      secretKey: encryptionKey
  target:
    name: pocket-id-encryption
