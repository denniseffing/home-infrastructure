apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pocket-id-operator
  namespace: flux-system
  labels:
    denniseffing.de/source: "public"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: pocket-id-operator
      namespace: pocket-id
  interval: 1h
  path: kubernetes/infrastructure/pocket-id/pocket-id-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: pocket-id
  timeout: 5m
  wait: true
