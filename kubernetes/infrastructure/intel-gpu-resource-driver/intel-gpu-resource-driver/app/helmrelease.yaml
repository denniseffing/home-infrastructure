apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  interval: 1h
  values:
    kubeletPlugin:
      nodeSelector:
        kubernetes.io/hostname: joey
      # xpumd >= 2.1.0 renamed its socket, but the driver still defaults to `intelxpuinfo.sock`
      extraArgs: "--xpumd-socket=/run/xpumd/intel_xpu_info.sock"
    # xpumd is deployed separately via a standalone HelmRelease, see ../../xpumd
    xpumdEnabled: false
