apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ack-dashboard
  namespace: flux-system
  labels:
    denniseffing.de/source: "public"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/infrastructure/aws/ack-dashboard/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: aws
  wait: false
  interval: 30m
  timeout: 5m
