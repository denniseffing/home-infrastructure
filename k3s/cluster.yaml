---
- name: Configure NFS share on rachel
  hosts: rachel
  become: true
  tasks:
    - name: Install NFS server
      package:
        name: nfs-utils
        state: present
    - name: Create NFS root
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /nfs/storage-1
        - /nfs/storage-2
    - name: Configure bind mounts
      mount:
        src: "{{ item.source }}"
        path: "{{ item.destination }}"
        fstype: none
        opts: bind
        state: mounted
      loop:
        - { source: /mnt/storage-1, destination: /nfs/storage-1 }
        - { source: /mnt/storage-2, destination: /nfs/storage-2 }
    - name: Export NFS shares
      lineinfile:
        path: /etc/exports
        line: "{{ item }} 192.168.0.0/16(rw,sync,no_subtree_check)"
        create: yes
      loop:
        - /nfs/storage-1
        - /nfs/storage-2
      notify:
        - Restart NFS server
  handlers:
    - name: Restart NFS server
      service:
        name: nfs-server
        state: restarted
        enabled: true
- name: Export disk power state metrics on rachel
  hosts: rachel
  become: true
  tasks:
    - name: Install hdparm
      package:
        name: hdparm
        state: present
    - name: Create node-exporter textfile collector directory
      file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        mode: "0755"
    - name: Install disk power state script
      copy:
        dest: /usr/local/bin/disk-power-state.sh
        mode: "0755"
        content: |
          #!/bin/bash
          dir=/var/lib/node_exporter/textfile_collector
          tmp=$(mktemp -p "$dir")
          {
            echo "# HELP node_disk_spinning 1 if the disk is spinning (active/idle), 0 if spun down (standby)"
            echo "# TYPE node_disk_spinning gauge"
            for d in /dev/sdb /dev/sdc; do
              state=$(hdparm -C "$d" 2>/dev/null | awk '/drive state/ {print $NF}')
              case "$state" in
                standby)     v=0 ;;
                active/idle) v=1 ;;
                *)           continue ;;
              esac
              echo "node_disk_spinning{device=\"${d#/dev/}\"} $v"
            done
          } > "$tmp"
          chmod 644 "$tmp"
          mv "$tmp" "$dir/disk_power.prom"
    - name: Install disk power state service
      copy:
        dest: /etc/systemd/system/disk-power-state.service
        mode: "0644"
        content: |
          [Unit]
          Description=Export disk power state for node-exporter

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/disk-power-state.sh
    - name: Install disk power state timer
      copy:
        dest: /etc/systemd/system/disk-power-state.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Export disk power state for node-exporter every minute

          [Timer]
          OnCalendar=minutely

          [Install]
          WantedBy=timers.target
    - name: Enable disk power state timer
      systemd:
        name: disk-power-state.timer
        enabled: true
        state: started
        daemon_reload: true
- name: Prepare nodes for longhorn
  hosts: k3s_cluster
  become: true
  vars:
    longhorn_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
  tasks:
    - name: Enable dm_crypt kernel module
      modprobe:
        name: dm_crypt
        state: present
        persistent: present
    - name: Install packages required by Longhorn
      package:
        name:
          - open-iscsi
          - cryptsetup
        state: present
    - name: Start services required by Longhorn
      service:
        name: iscsid
        enabled: true
        state: started
- name: Prepare nodes for Matter & OpenThread Border Router
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Configure IPv6 prerequisites for Matter & OpenThread Border Router
      sysctl:
        name: '{{ item.key }}'
        value: '{{ item.value }}'
        reload: true
        state: present
      with_dict:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.eth0.accept_ra: 2
        net.ipv6.conf.eth0.accept_ra_rt_info_max_plen: 64
- name: Set up k3s cluster
  hosts: k3s_cluster
  vars:
    k3s_become: true
    k3s_etcd_datastore: true
    k3s_state: installed
    k3s_registration_address: 192.168.178.40
    k3s_release_version: v1.37.1+k3s1
    k3s_server_manifests_templates:
      - manifests/kube-vip.yaml
      - manifests/kube-vip-cloud-controller.yaml
    k3s_server:
      cluster-cidr: 10.52.0.0/16
      flannel-backend: "none"
      disable-network-policy: true
      disable:
        - traefik
        - servicelb
      etcd-expose-metrics: true
      secrets-encryption: true
      kube-apiserver-arg:
        - "feature-gates=DRAExtendedResource=true,DRADeviceTaints=true,DRAAdminAccess=true,DRAPartitionableDevices=true,DRAResourceClaimDeviceStatus=true,ResourceHealthStatus=true,DRAPrioritizedList=true"
        - "runtime-config=resource.k8s.io/v1beta1=true,resource.k8s.io/v1alpha3=true"
      kube-controller-manager-arg:
        - "feature-gates=DRADeviceTaints=true,DRAAdminAccess=true,DRAPrioritizedList=true"
      kube-scheduler-arg:
        - "feature-gates=DRAExtendedResource=true,DRADeviceTaints=true,DRAAdminAccess=true,DRAPartitionableDevices=true,DRAPrioritizedList=true"
      kubelet-arg:
        - "feature-gates=DRAExtendedResource=true,ResourceHealthStatus=true"
      nonroot-devices: true
      tls-san: 192.168.178.40
    k3s_agent:
      kubelet-arg:
        - "feature-gates=DRAExtendedResource=true,ResourceHealthStatus=true"
      nonroot-devices: true
  roles:
    - role: xanmanning.k3s
      vars:
        k3s_cgroup_subsys: []
